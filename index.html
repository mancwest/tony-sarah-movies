<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Tony &amp; Sarah's Movie Watchlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<style>
  :root{
    --bg: #0f0d09;
    --bg-2: #191510;
    --card: #221d15;
    --card-border: #3e3524;
    --cream: #f4ecd8;
    --cream-dim: #beb096;
    --mustard: #e6b64c;
    --mustard-dim: #b98d2e;
    --rust: #c65a30;
    --watched-green: #7a9a6a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--cream);
    font-family: Georgia, 'Times New Roman', serif;
    min-height:100vh;
    padding-bottom: 60px;
  }
  .sprockets{
    height: 14px;
    background-image: radial-gradient(circle, var(--bg) 3px, transparent 3.5px);
    background-size: 22px 14px;
    background-position: 10px center;
    background-color: var(--mustard-dim);
  }
  .header{
    padding: 26px 20px 18px;
    background: radial-gradient(120% 100% at 50% 0%, #241f14, var(--bg) 70%);
    text-align: center;
    position: relative;
  }
  .header .kicker{
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 15px;
    color: var(--cream-dim);
    letter-spacing: 0.5px;
    margin: 0 0 2px;
  }
  .header h1{
    margin:0;
    font-family: 'Bebas Neue', Georgia, sans-serif;
    font-weight: 400;
    font-size: 40px;
    letter-spacing: 2px;
    color: var(--mustard);
    text-shadow: 0 0 18px rgba(230,182,76,0.35), 0 2px 0 rgba(0,0,0,0.4);
    line-height: 1.05;
  }
  .header p{
    margin: 8px 0 0;
    font-family: -apple-system, sans-serif;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--cream-dim);
  }
  .controls{
    padding: 14px 20px 0;
    display:flex;
    flex-direction:column;
    gap: 10px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 20;
    padding-bottom: 8px;
  }
  input[type=text]{
    width:100%;
    font-family: -apple-system, sans-serif;
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--cream);
    padding: 10px 12px;
    border-radius: 3px;
    font-size: 15px;
  }
  input[type=text]:focus{ outline: none; border-color: var(--mustard); }
  .chip-row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{
    font-family: -apple-system, sans-serif;
    flex-shrink:0;
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--cream-dim);
    padding: 7px 13px;
    border-radius: 20px;
    font-size: 12.5px;
    cursor:pointer;
    white-space:nowrap;
  }
  .chip.active{
    background: var(--mustard);
    color: #1a1710;
    border-color: var(--mustard);
    font-weight:600;
  }
  .chip.xmas.active{
    background: var(--rust);
    border-color: var(--rust);
    color: #fff;
  }
  select{
    font-family: -apple-system, sans-serif;
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--cream);
    padding: 7px 10px;
    border-radius: 20px;
    font-size: 12.5px;
    flex-shrink:0;
  }
  .stats-row{
    font-family: -apple-system, sans-serif;
    font-size: 12px;
    color: var(--cream-dim);
    padding: 2px 2px 0;
    display:flex;
    justify-content: space-between;
    align-items:center;
  }
  .toggle-chip{
    font-family: -apple-system, sans-serif;
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--cream-dim);
    padding: 5px 11px;
    border-radius: 14px;
    font-size: 11.5px;
    cursor:pointer;
  }
  .toggle-chip.active{
    background: var(--mustard);
    color:#1a1710;
    border-color: var(--mustard);
    font-weight:600;
  }
  .toggle-group{ display:flex; gap:6px; }
  .grid{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    padding: 16px 20px 10px;
  }
  .card{
    position:relative;
    border-radius: 4px;
    overflow:hidden;
    border: 1px solid var(--card-border);
    background: var(--card);
    cursor:pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    transition: transform 0.12s ease;
  }
  .card:active{ transform: scale(0.96); }
  .cover{
    aspect-ratio: 2/3;
    position:relative;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding: 8px;
    background-size: cover;
    background-position: center;
  }
  .cover.no-poster{
    padding: 10px;
  }
  .cover-shade{
    position:absolute;
    inset:0;
    background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.05) 30%, rgba(0,0,0,0.05) 55%, rgba(0,0,0,0.75) 100%);
    pointer-events:none;
  }
  .cover .top-row, .cover .title-block{ position:relative; z-index:2; }
  .cover .top-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
  }
  .rating-badge{
    font-size:11px;
    font-family: -apple-system, sans-serif;
    font-weight:700;
    background: rgba(0,0,0,0.5);
    color: var(--mustard);
    text-shadow: 0 0 6px rgba(230,182,76,0.6);
    padding: 3px 7px;
    border-radius: 3px;
  }
  .year-badge{
    font-size:11px;
    font-family: -apple-system, sans-serif;
    font-weight:700;
    background: rgba(0,0,0,0.5);
    color: var(--cream);
    padding: 3px 7px;
    border-radius: 3px;
  }
  .cover .title-block .t{
    font-size: 14.5px;
    font-weight:700;
    line-height: 1.15;
    color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }
  .cover .title-block .genre{
    font-family: -apple-system, sans-serif;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.8);
    margin-top: 3px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  .watch-toggle, .fav-toggle{
    position:absolute;
    top:8px;
    width:24px;
    height:24px;
    border-radius:50%;
    border: 1.5px solid rgba(255,255,255,0.7);
    background: rgba(0,0,0,0.4);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    color:#fff;
    z-index:3;
  }
  .watch-toggle{ right:8px; }
  .fav-toggle{ left:8px; }
  .card.watched .watch-toggle{
    background: var(--watched-green);
    border-color: var(--watched-green);
  }
  .card.faved .fav-toggle{
    background: var(--rust);
    border-color: var(--rust);
  }
  .card.watched .cover::after{
    content:"";
    position:absolute;
    inset:0;
    background: rgba(0,0,0,0.4);
    z-index:1;
  }
  .info-strip{
    font-family: -apple-system, sans-serif;
    padding: 7px 10px;
    font-size: 11px;
    color: var(--cream-dim);
    border-top: 1px solid var(--card-border);
    display:flex;
    justify-content:space-between;
  }
  .empty{
    grid-column: 1/-1;
    text-align:center;
    padding: 50px 20px;
    color: var(--cream-dim);
    font-family: -apple-system, sans-serif;
  }
  .empty .big{ font-size: 40px; margin-bottom: 8px; }
  .load-more-wrap{
    padding: 6px 20px 30px;
    text-align:center;
  }
  .load-more-btn{
    font-family: -apple-system, sans-serif;
    background: var(--card);
    border: 1px solid var(--mustard);
    color: var(--mustard);
    padding: 11px 22px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    cursor:pointer;
  }
  .sheet-backdrop{
    position:fixed;
    inset:0;
    background: rgba(0,0,0,0.65);
    display:none;
    align-items:flex-end;
    z-index: 100;
  }
  .sheet-backdrop.open{ display:flex; }
  .sheet{
    background: var(--bg-2);
    width:100%;
    max-height: 88vh;
    overflow-y:auto;
    border-radius: 16px 16px 0 0;
    border-top: 1px solid var(--card-border);
    padding: 18px 20px 30px;
  }
  .sheet-handle{
    width:36px;
    height:4px;
    background: var(--card-border);
    border-radius: 2px;
    margin: 0 auto 16px;
  }
  .sheet-top{
    display:flex;
    gap:14px;
  }
  .sheet-poster{
    width: 100px;
    flex-shrink:0;
    aspect-ratio: 2/3;
    border-radius: 4px;
    background-size: cover;
    background-position:center;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:8px;
  }
  .sheet-poster .t{
    font-size:13px;
    font-weight:700;
    color:#fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }
  .sheet-info h2{
    margin: 0 0 4px;
    font-family: 'Bebas Neue', Georgia, sans-serif;
    font-weight: 400;
    letter-spacing: 1px;
    font-size: 23px;
    color: var(--mustard);
    line-height: 1.05;
  }
  .sheet-meta{
    font-family: -apple-system, sans-serif;
    font-size: 12px;
    color: var(--cream-dim);
    margin-bottom: 8px;
  }
  .sheet-tags{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .sheet-tags span{
    font-family: -apple-system, sans-serif;
    font-size: 11px;
    background: var(--card);
    border: 1px solid var(--card-border);
    padding: 3px 8px;
    border-radius: 12px;
    color: var(--cream-dim);
  }
  .sheet-overview{
    margin-top: 16px;
    font-size: 14.5px;
    line-height: 1.5;
    color: var(--cream-dim);
  }
  .sheet-extra{
    margin-top: 14px;
    font-family: -apple-system, sans-serif;
    font-size: 12px;
    color: var(--cream-dim);
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 14px;
  }
  .sheet-extra div b{
    display:block;
    color: var(--cream);
    font-size: 13px;
    font-weight:600;
  }
  .sheet-btn-row{
    display:flex;
    gap:10px;
    margin-top: 18px;
  }
  .sheet-btn{
    font-family: -apple-system, sans-serif;
    font-weight:600;
    font-size: 14px;
    padding: 12px;
    border-radius: 6px;
    border: 1px solid var(--mustard);
    background: transparent;
    color: var(--mustard);
    flex:1;
  }
  .sheet-btn.watched{
    background: var(--watched-green);
    border-color: var(--watched-green);
    color: #1a1710;
  }
  .fav-btn{
    width:52px;
    flex:none;
    font-size: 18px;
    border: 1px solid var(--card-border);
    background: var(--card);
    color: var(--cream-dim);
    border-radius: 6px;
  }
  .fav-btn.faved{
    background: var(--rust);
    border-color: var(--rust);
    color: #fff;
  }
  .footer-note{
    text-align:center;
    font-family: -apple-system, sans-serif;
    font-size: 11px;
    color: var(--cream-dim);
    opacity:0.6;
    padding: 10px 30px 20px;
  }
  .toast{
    position:fixed;
    bottom: 16px;
    left:50%;
    transform: translateX(-50%);
    background: var(--cream);
    color: #1a1710;
    font-family: -apple-system, sans-serif;
    font-size: 13px;
    font-weight:600;
    padding: 9px 18px;
    border-radius: 20px;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.25s ease;
    z-index: 150;
  }
  .toast.show{ opacity: 1; }
</style>
</head>
<body>

<div class="sprockets"></div>
<div class="header">
  <p class="kicker">Tony &amp; Sarah's</p>
  <h1>Movie Watchlist</h1>
  <p id="totalCountLabel">Pick something for tonight</p>
</div>
<div class="sprockets"></div>

<div class="controls">
  <input type="text" id="search" placeholder="Search title...">
  <div class="chip-row" id="yearRow">
    <select id="yearSelect"></select>
  </div>
  <div class="chip-row" id="ratingChips"></div>
  <div class="chip-row" id="genreChips"></div>
  <div class="stats-row">
    <span id="countLabel"></span>
    <span class="toggle-group">
      <button class="toggle-chip" id="toggleFavourites">favourites</button>
      <button class="toggle-chip" id="toggleUnwatched">unwatched</button>
    </span>
  </div>
</div>

<div class="grid" id="grid"></div>
<div class="load-more-wrap" id="loadMoreWrap">
  <button class="load-more-btn" id="loadMoreBtn"></button>
</div>

<div class="footer-note">Tap a cover for details. Tap the circles to mark watched or favourite. Watched &amp; favourites are shared between everyone who opens this page. Poster art and details via TMDB.</div>

<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet" id="sheet"></div>
</div>

<script>
function decodeMovies(){
  const b64 = document.getElementById('movie-data-gz').textContent.trim();
  const binaryStr = atob(b64);
  const bytes = new Uint8Array(binaryStr.length);
  for(let i=0; i<binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);
  const jsonStr = pako.inflate(bytes, { to: 'string' });
  return JSON.parse(jsonStr);
}
const MOVIES = decodeMovies();

const PALETTES = {
  Family:   ["#c1552c","#8a3a1c"],
  Comedy:   ["#d9a441","#a3701f"],
  Drama:    ["#3d6b6e","#274a4c"],
  Animation:["#6e3d5c","#4a2740"],
  Fantasy:  ["#5c7a52","#3d5636"],
  Adventure:["#7a5230","#4f3319"],
  Romance:  ["#a34d5f","#712f3c"],
  Thriller: ["#2c3e50","#182530"],
  Action:   ["#7a3030","#4f1e1e"],
  Crime:    ["#3a3a3a","#1c1c1c"],
  Horror:   ["#241c30","#120e18"],
  Default:  ["#4a4438","#2c2820"]
};

const PAGE_SIZE = 40;

let watched = {};
let favourites = {};
let unwatchedOnly = false;
let favouritesOnly = false;
let activeYear = "All";
let activeRating = "All";
let activeGenre = "All";
let searchTerm = "";
let sortBy = "rating";
let renderLimit = PAGE_SIZE;

const grid = document.getElementById('grid');
const toast = document.getElementById('toast');
const countLabel = document.getElementById('countLabel');
const totalCountLabel = document.getElementById('totalCountLabel');
const sheetBackdrop = document.getElementById('sheetBackdrop');
const sheet = document.getElementById('sheet');
const loadMoreWrap = document.getElementById('loadMoreWrap');
const loadMoreBtn = document.getElementById('loadMoreBtn');

const yearsPresent = MOVIES.map(m => m.y);
const minYear = Math.min(...yearsPresent);
const maxYear = Math.max(...yearsPresent);
totalCountLabel.textContent = `${MOVIES.length} films \u00b7 ${minYear}\u2013${maxYear} \u00b7 pick something for tonight`;

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> toast.classList.remove('show'), 1600);
}

const JSONBIN_ID = '6a97d2ffda38895dfe2e50ef';
const JSONBIN_KEY = '$2a$10$3kGtTJJYhRJjTTkHMj1XvucbORCrVkLgVi8HVxwHF6PaxvtxxuwFe';
const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_ID}`;

async function loadWatched(){
  try{
    const res = await fetch(JSONBIN_URL + '/latest', {
      headers: { 'X-Master-Key': JSONBIN_KEY }
    });
    const data = await res.json();
    const record = data.record || {};
    watched = record.watched || {};
    favourites = record.favourites || {};
  }catch(e){
    watched = {}; favourites = {};
    showToast("Couldn't load shared list — check connection");
  }
  render();
}

async function saveState(){
  try{
    await fetch(JSONBIN_URL, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': JSONBIN_KEY
      },
      body: JSON.stringify({ watched, favourites })
    });
  }catch(e){
    showToast("Couldn't save — try again");
  }
}

function toggleWatched(id){
  if(watched[id]){ delete watched[id]; } else { watched[id] = true; }
  render();
  if(sheetBackdrop.classList.contains('open')){ openSheet(MOVIES.find(m=>m.id===id)); }
  saveState();
}
function toggleFavourite(id){
  if(favourites[id]){ delete favourites[id]; } else { favourites[id] = true; }
  render();
  if(sheetBackdrop.classList.contains('open')){ openSheet(MOVIES.find(m=>m.id===id)); }
  saveState();
}

function buildChips(container, options, active, onPick, xmasAware){
  container.innerHTML = '';
  options.forEach(opt=>{
    const b = document.createElement('button');
    b.className = 'chip' + (opt === active ? ' active' : '') + (xmasAware && opt === 'Christmas' ? ' xmas' : '');
    b.textContent = opt;
    b.onclick = ()=> onPick(opt);
    container.appendChild(b);
  });
}

function renderYearSelect(){
  const select = document.getElementById('yearSelect');
  if(select.options.length > 0) return; // build once
  const years = Array.from(new Set(MOVIES.map(m => m.y))).sort((a,b)=> b - a);
  const optAll = document.createElement('option');
  optAll.value = "All";
  optAll.textContent = "All years";
  select.appendChild(optAll);
  years.forEach(y=>{
    const opt = document.createElement('option');
    opt.value = y;
    opt.textContent = y;
    select.appendChild(opt);
  });
  select.value = activeYear;
  select.addEventListener('change', (e)=>{
    activeYear = e.target.value;
    renderLimit = PAGE_SIZE;
    render();
  });
}

function renderChips(){
  renderYearSelect();
  const ratings = ["All","8+","7+","6+","5+"];
  buildChips(document.getElementById('ratingChips'), ratings, activeRating, (r)=>{
    activeRating = r; renderLimit = PAGE_SIZE; renderChips(); render();
  });
  const genreSet = new Set();
  MOVIES.forEach(m => m.g.forEach(g => genreSet.add(g)));
  const genres = ["All", "Christmas", ...Array.from(genreSet).sort()];
  buildChips(document.getElementById('genreChips'), genres, activeGenre, (g)=>{
    activeGenre = g; renderLimit = PAGE_SIZE; renderChips(); render();
  }, true);
}

document.getElementById('search').addEventListener('input', (e)=>{
  searchTerm = e.target.value.toLowerCase();
  renderLimit = PAGE_SIZE;
  render();
});

document.getElementById('toggleUnwatched').addEventListener('click', (e)=>{
  unwatchedOnly = !unwatchedOnly;
  e.target.classList.toggle('active', unwatchedOnly);
  renderLimit = PAGE_SIZE;
  render();
});
document.getElementById('toggleFavourites').addEventListener('click', (e)=>{
  favouritesOnly = !favouritesOnly;
  e.target.classList.toggle('active', favouritesOnly);
  renderLimit = PAGE_SIZE;
  render();
});

loadMoreBtn.addEventListener('click', ()=>{
  renderLimit += PAGE_SIZE;
  render(true);
});

sheetBackdrop.addEventListener('click', (e)=>{
  if(e.target === sheetBackdrop) closeSheet();
});
function closeSheet(){ sheetBackdrop.classList.remove('open'); }

function formatMoney(n){
  if(!n || n <= 0) return null;
  if(n >= 1000000000) return '$' + (n/1000000000).toFixed(1) + 'B';
  if(n >= 1000000) return '$' + (n/1000000).toFixed(0) + 'M';
  return '$' + n.toLocaleString();
}

function posterStyle(m){
  if(m.p){
    return `background-image: url('${m.p}');`;
  }
  const pal = PALETTES[m.g[0]] || PALETTES.Default;
  return `background: linear-gradient(160deg, ${pal[0]}, ${pal[1]});`;
}

function openSheet(m){
  const isWatched = !!watched[m.id];
  const isFaved = !!favourites[m.id];
  const money = formatMoney(m.bo);
  sheet.innerHTML = `
    <div class="sheet-handle"></div>
    <div class="sheet-top">
      <div class="sheet-poster" style="${posterStyle(m)}">${m.p ? '' : `<div class="t">${m.t}</div>`}</div>
      <div class="sheet-info">
        <h2>${m.t}</h2>
        <div class="sheet-meta">${m.y}${m.rt ? ' &middot; ' + m.rt + ' min' : ''}${m.d ? ' &middot; dir. ' + m.d : ''}</div>
        <div class="sheet-tags">
          ${m.r ? `<span>&#9733; ${m.r}</span>` : ''}
          ${m.g.map(g=>`<span>${g}</span>`).join('')}
          ${m.h ? '<span>&#10052; Christmas</span>' : ''}
        </div>
      </div>
    </div>
    <div class="sheet-overview">${m.ov || 'No synopsis available.'}</div>
    <div class="sheet-extra">
      ${money ? `<div>Box office<b>${money}</b></div>` : ''}
      ${m.st ? `<div>Studio<b>${m.st}</b></div>` : ''}
    </div>
    <div class="sheet-btn-row">
      <button class="sheet-btn fav-btn ${isFaved ? 'faved' : ''}" id="sheetFavBtn" aria-label="Toggle favourite">&#9829;</button>
      <button class="sheet-btn ${isWatched ? 'watched' : ''}" id="sheetToggleBtn">${isWatched ? "Marked as watched" : "Mark as watched"}</button>
    </div>
  `;
  document.getElementById('sheetToggleBtn').onclick = ()=> toggleWatched(m.id);
  document.getElementById('sheetFavBtn').onclick = ()=> toggleFavourite(m.id);
  sheetBackdrop.classList.add('open');
}

function getFiltered(){
  let filtered = MOVIES.filter(m=>{
    if(activeYear !== "All" && String(m.y) !== activeYear) return false;
    if(activeRating !== "All"){
      const minRating = parseInt(activeRating);
      if(!m.r || m.r < minRating) return false;
    }
    if(activeGenre === "Christmas" && !m.h) return false;
    if(activeGenre !== "All" && activeGenre !== "Christmas" && !m.g.includes(activeGenre)) return false;
    if(searchTerm && !m.t.toLowerCase().includes(searchTerm)) return false;
    if(unwatchedOnly && watched[m.id]) return false;
    if(favouritesOnly && !favourites[m.id]) return false;
    return true;
  });
  if(sortBy === "rating") filtered.sort((a,b)=> (b.r||0) - (a.r||0));
  else if(sortBy === "year") filtered.sort((a,b)=> b.y - a.y);
  else if(sortBy === "title") filtered.sort((a,b)=> a.t.localeCompare(b.t));
  return filtered;
}

function render(keepScroll){
  const filtered = getFiltered();
  const watchedCount = MOVIES.filter(m=>watched[m.id]).length;
  countLabel.textContent = `${filtered.length} shown \u00b7 ${watchedCount} watched total`;

  const toRender = filtered.slice(0, renderLimit);

  if(!keepScroll) grid.innerHTML = '';
  else {
    // remove nothing, we'll just append new items
  }

  if(filtered.length === 0){
    grid.innerHTML = `<div class="empty"><div class="big">&#127916;</div>Nothing on the shelf matches that.</div>`;
    loadMoreWrap.style.display = 'none';
    return;
  }

  const startIdx = keepScroll ? grid.children.length : 0;
  const itemsToAdd = keepScroll ? toRender.slice(startIdx) : toRender;

  itemsToAdd.forEach(m=>{
    const isWatched = !!watched[m.id];
    const isFaved = !!favourites[m.id];
    const card = document.createElement('div');
    card.className = 'card' + (isWatched ? ' watched' : '') + (isFaved ? ' faved' : '');
    card.innerHTML = `
      <div class="cover ${m.p ? '' : 'no-poster'}" style="${posterStyle(m)}">
        <div class="cover-shade"></div>
        <div class="top-row">
          <span class="rating-badge">${m.r ? '&#9733; ' + m.r : ''}</span>
          <span class="year-badge">${m.h ? '&#10052; ' : ''}${m.y}</span>
        </div>
        <div class="title-block">
          <div class="t">${m.t}</div>
          <div class="genre">${m.g[0] || ''}</div>
        </div>
        <div class="fav-toggle">${isFaved ? '&#9829;' : ''}</div>
        <div class="watch-toggle">${isWatched ? '&#10003;' : ''}</div>
      </div>
      <div class="info-strip"><span>${m.rt ? m.rt + ' min' : ''}</span><span>${isWatched ? 'watched' : 'to watch'}</span></div>
    `;
    card.querySelector('.watch-toggle').addEventListener('click', (e)=>{
      e.stopPropagation();
      toggleWatched(m.id);
      showToast(isWatched ? `Marked "${m.t}" as unwatched` : `Marked "${m.t}" as watched`);
    });
    card.querySelector('.fav-toggle').addEventListener('click', (e)=>{
      e.stopPropagation();
      toggleFavourite(m.id);
      showToast(isFaved ? `Removed "${m.t}" from favourites` : `Added "${m.t}" to favourites`);
    });
    card.addEventListener('click', ()=> openSheet(m));
    grid.appendChild(card);
  });

  if(filtered.length > renderLimit){
    loadMoreWrap.style.display = 'block';
    loadMoreBtn.textContent = `Show more (${filtered.length - renderLimit} left)`;
  } else {
    loadMoreWrap.style.display = 'none';
  }
}

renderChips();
loadWatched();

setInterval(async ()=>{
  if(sheetBackdrop.classList.contains('open')) return;
  try{
    const res = await fetch(JSONBIN_URL + '/latest', {
      headers: { 'X-Master-Key': JSONBIN_KEY }
    });
    const data = await res.json();
    const record = data.record || {};
    const latestWatched = record.watched || {};
    const latestFav = record.favourites || {};
    const changed = JSON.stringify(latestWatched) !== JSON.stringify(watched) || JSON.stringify(latestFav) !== JSON.stringify(favourites);
    if(changed){
      watched = latestWatched;
      favourites = latestFav;
      render();
    }
  }catch(e){}
}, 15000);
</script>

</body>
</html>
